[project]
name = "beancount-ui"
version = "0.1.2"
description = "Local-first Beancount journal"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beancount>=3.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "filelock>=3.18,<4",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
  "debugpy>=1.8,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/beancount_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
