services:
  ledger:
    image: ${BEANCOUNT_IMAGE:-ghcr.io/silevilence/beancount_ui:V0.1.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BEANCOUNT_ACCESS_MODE: private
      BEANCOUNT_ACCESS_TOKEN_FILE: /run/secrets/access_token
      BEANCOUNT_ALLOWED_ORIGINS: ${BEANCOUNT_ALLOWED_ORIGINS:-http://127.0.0.1:8000}
      BEANCOUNT_GIT_BRANCH: ${BEANCOUNT_GIT_BRANCH:-master-1}
      BEANCOUNT_GIT_REMOTE: ${BEANCOUNT_GIT_REMOTE:-}
    volumes:
      - ${BEANCOUNT_DATA_DIR:?Set an absolute data directory outside the source repository}/ledger:/data/ledger
      - ${BEANCOUNT_DATA_DIR}/state:/data/state
    secrets:
      - access_token
secrets:
  access_token:
    file: ${BEANCOUNT_DATA_DIR}/access-token
